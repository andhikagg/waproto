name: update-waproto

on:
  schedule:
    - cron: "0 * * * *"   # check upstream every hour
  workflow_dispatch:       # can be run manually from the Actions tab
    inputs:
      force:
        description: "Rebuild even if there are no new commits"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-waproto
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check latest upstream commit
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          LATEST=$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/wppconnect-team/wa-proto/commits/main | jq -r .sha)
          # do not trust odd API results (rate limit, error, "null")
          if ! [[ "$LATEST" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid upstream SHA: '$LATEST'" >&2
            exit 1
          fi
          OLD=$(cat .waproto-sha 2>/dev/null || echo none)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$OLD" ] || [ "$FORCE" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new upstream commit ($LATEST)"
          fi

      - name: Build WAProto
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          npm install --no-save protobufjs protobufjs-cli
          # use the proto from the SHA we just checked, not "main", so the build
          # always matches the value stored in .waproto-sha
          export PROTO_URL="https://raw.githubusercontent.com/wppconnect-team/wa-proto/$LATEST/WAProto.proto"
          OUT_DIR=WAProto ZIP_NAME=waproto-build.zip bash update.sh
          echo "$LATEST" > .waproto-sha

      - name: Upload build zip
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: waproto-build
          path: WAProto/waproto-build.zip
          if-no-files-found: error

      - name: Commit build output
        if: steps.check.outputs.changed == 'true'
        shell: bash
        env:
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WAProto/index.js WAProto/index.d.ts WAProto/WAProto.proto .waproto-sha
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "chore: update WAProto ($LATEST)"
            git push
          fi
